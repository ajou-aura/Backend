# Test configuration using H2 in-memory database

# H2 Datasource
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable MariaDB-specific connection init SQL for H2
spring.datasource.hikari.connection-init-sql=

# JWT Secret (test-only, not production) - Must be Base64 encoded
jwt.key=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktbWluLTMyLWNoYXJzLWZvci1oczI1Ni1hbGdvcml0aG0tdXNl

# CORS (test)
cors.allowed-origins=http://localhost:3000

# App config
app.frontend-url=http://localhost:3000

# Firebase (fake config that passes blank check - Firebase init will fail at runtime in tests which is fine)
firebase.service.account.json.base64=false
firebase.service.account.json={"type":"service_account","project_id":"test-project","private_key_id":"test","private_key":"MIIEowIBAAKCAQEAtest","client_email":"test@test.iam.gserviceaccount.com","client_id":"123456789"}

# DDL_AUTO for tests
DDL_AUTO=create-drop
SHOW_SQL=true
LOGGING_LEVEL=DEBUG

# Notice categories that require posted date
notice.categories-require-posted-date=dormitory

# Parser defaults
notice.parser.default=defaultParser

# App keywords
app.keywords.seed=테스트,키워드
app.keywords.retag-on-start=false

# Auth allowed domains
app.auth.allowed-domains=ajou.ac.kr

# Admin emails
app.admin.emails=admin@test.com

# Google OAuth (test values)
oauth.google.client-id=test-client-id
oauth.google.client-secret=test-client-secret
oauth.google.redirect-uri=http://localhost:8080/api/auth/callback
oauth.google.scope=email profile openid